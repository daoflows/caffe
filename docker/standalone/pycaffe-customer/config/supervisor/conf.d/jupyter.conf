[program:jupyter]
user=builder
command=jupyter notebook
directory=/workspace
autorestart=true
startretries=3
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/jupyter-stderr.log
stderr_logfile_maxbytes=1048576
redirect_stderr=false
environment=HOME="/home/builder",USER="builder",LANG="C.UTF-8",LC_ALL="C.UTF-8",PATH="/usr/local/bin:/usr/bin:/bin",JUPYTER_CONFIG_DIR="/home/builder/.jupyter"
