[program:jupyter]
user=builder
command=jupyter notebook --config=/home/builder/.jupyter/jupyter_notebook_config.py
directory=/workspace
autorestart=true
startretries=3
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/jupyter-stderr.log
stderr_logfile_maxbytes=1048576
redirect_stderr=false
environment=HOME="/home/builder",USER="builder",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8",PATH="/usr/local/bin:/usr/bin:/bin"
