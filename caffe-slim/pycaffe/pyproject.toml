[build-system]
requires = ["scikit-build-core>=0.10", "ninja>=1.11", "cmake>=3.26"]
build-backend = "scikit_build_core.build"

[project]
name = "caffe"
version = "1.0.0"
description = "Caffe Python Interface (tvm-ffi slimmed version) - CPU-only inference"
readme = { text = "PyCaffe: Caffe Deep Learning Framework Python Interface (slim inference-only)", content-type = "text/plain" }
license = { text = "BSD-2-Clause" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["deep learning", "caffe", "inference", "neural network"]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.scikit-build]
minimum-version = "0.10"
wheel.py-api = "py3"
wheel.install-dir = ""
build-dir = "build-wheel"
cmake.version = "CMakeLists.txt"
cmake.build-type = "Release"
ninja.make-fallback = false
wheel.packages = []

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
